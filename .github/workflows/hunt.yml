name: AI Promo Hunter coverage audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check live feeds, web discovery, and classification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          python - <<'PY'
          import logging
          import os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from urllib.parse import urlsplit

          import requests
          from google.genai.errors import APIError

          from promo_hunter.__main__ import select_candidates
          from promo_hunter.filtering import DEFAULT_MODEL, classify
          from promo_hunter.sources import discover
          from promo_hunter.state import Seen

          logging.basicConfig(level=logging.WARNING, format="%(levelname)s: %(message)s")
          logging.getLogger("promo_hunter.sources").setLevel(logging.DEBUG)
          tavily = os.getenv("TAVILY_API_KEY", "").strip()
          brave = os.getenv("BRAVE_API_KEY", "").strip()
          now = datetime.now(timezone.utc)
          try:
              with requests.Session() as session:
                  candidates = discover(session, now, tavily, brave)
              def host(post):
                  return urlsplit(post.url).hostname
              print("Discovered:", Counter((post.source_id.partition(":")[0], host(post)) for post in candidates), flush=True)
              with TemporaryDirectory() as folder:
                  batch = select_candidates(candidates, Seen(Path(folder) / "seen.json"))
              print("Selected:", Counter(map(host, batch)), flush=True)
              key = os.environ["GEMINI_API_KEY"]
              model = os.getenv("GEMINI_MODEL", "").strip() or DEFAULT_MODEL
              offers = classify(key, model, batch, now) if batch else []
              for post, offer in zip(batch, offers, strict=True):
                  if offer:
                      print("Approved:", host(post), offer.deadline, flush=True)
              print(f"Audit result: {sum(offer is not None for offer in offers)} approved out of {len(batch)} classified; no Telegram alerts or state writes")
          except APIError as exc:
              raise SystemExit(f"Gemini returned HTTP {exc.code}") from None
          except Exception as exc:
              raise SystemExit(f"Audit failed ({type(exc).__name__})") from None
          PY
